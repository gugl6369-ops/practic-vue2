<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script defer src="js/vue.js"></script>
    <script defer src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>Product App</title>
</head>
<body style="background-color: honeydew">
    <div
        id="app" style=" display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative;"
        >
        <div
            class="cart"
            style="position: sticky ;display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; top: 0; background-color: #9cc5e6; cursor: pointer"
            v-on:click="openCart()"
            >
            <p> Cart({{ cart.length }}) </p>
        </div>
        <basket :style="{display :modal ? 'flex' : 'none'}" :cart="cart"></basket>
        <product :premium="premium" @add-to-cart="updateCart" ></product>
    </div>
</body>
</html>
